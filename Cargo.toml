[package]
name = "meteosense"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.9", features = ["derive"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.9"
