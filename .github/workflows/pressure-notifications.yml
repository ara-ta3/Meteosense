name: Pressure notifications

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk libfontconfig1-dev
      - name: Build CLI
        run: |
          rustup update stable
          cargo +stable build --locked --release
      - name: Post pressure notification
        env:
          METEOSENSE_LATITUDE: ${{ secrets.METEOSENSE_LATITUDE }}
          METEOSENSE_LONGITUDE: ${{ secrets.METEOSENSE_LONGITUDE }}
          METEOSENSE_LOCATION_NAME: ${{ secrets.METEOSENSE_LOCATION_NAME }}
          METEOSENSE_TIMEZONE: ${{ vars.METEOSENSE_TIMEZONE || 'Asia/Tokyo' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: ./target/release/meteosense
